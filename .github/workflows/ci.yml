name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Python syntax check & unit tests
        run: |
          python -m py_compile run.py backend/server.py backend/exporter.py
          python -m unittest discover -s tests -v

      - name: Run JavaScript syntax check & unit tests
        run: |
          find public/js -name "*.js" -exec node --check {} +
          node --test tests/test_catalog.mjs
