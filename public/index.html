<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity UI Builder</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Moveable.js for drag/resize/rotate -->
    <script src="https://unpkg.com/moveable@0.51.0/dist/moveable.min.js"></script>
    <!-- Panzoom for infinite canvas -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Top Navigation / Toolbar -->
        <header class="toolbar">
            <div class="logo">AG Builder</div>
            <div class="tools">
                <button class="tool-btn active" data-tool="select" title="Select (V)"><i class="icon-select"></i> Select</button>
                <div class="separator"></div>
                <button class="tool-btn" data-tool="rect" title="Rectangle (R)"><i class="icon-rect"></i> Rect</button>
                <button class="tool-btn" data-tool="circle" title="Circle (O)"><i class="icon-circle"></i> Circle</button>
                <button class="tool-btn" data-tool="text" title="Text (T)"><i class="icon-text"></i> Text</button>
                <div class="separator"></div>
                <button class="tool-btn" data-tool="button" title="Button"><i class="icon-button"></i> Button</button>
                <button class="tool-btn" data-tool="input" title="Input"><i class="icon-input"></i> Input</button>
            </div>
            <div class="actions">
                <button id="btn-save" class="action-btn primary">Export HTML</button>
            </div>
        </header>

        <div class="main-workspace">
            <!-- Left Sidebar: Layers & Components -->
            <aside class="sidebar left-sidebar">
                <div class="panel-section">
                    <h3>Frames (Pages)</h3>
                    <ul id="frames-list" class="layer-list">
                        <!-- Frame items injected here -->
                    </ul>
                    <button id="btn-add-frame" class="full-btn">+ New Frame</button>
                </div>
                <div class="panel-section flex-grow">
                    <h3>Elements (Layers)</h3>
                    <ul id="layers-list" class="layer-list">
                        <!-- Layer items injected here -->
                    </ul>
                </div>
                <div class="panel-section">
                    <h3>Components</h3>
                    <ul id="components-list" class="layer-list">
                        <!-- Component items injected here -->
                    </ul>
                    <button id="btn-create-component" class="full-btn" disabled>Create Component</button>
                </div>
            </aside>

            <!-- Center Canvas -->
            <main class="canvas-container" id="canvas-container">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <!-- The active frame sits here -->
                    <div id="active-frame" class="frame" data-id="frame-1">
                        <!-- Elements get appended here -->
                    </div>
                </div>
            </main>

            <!-- Right Sidebar: Properties -->
            <aside class="sidebar right-sidebar">
                <div id="properties-empty">Select an element to edit properties.</div>
                
                <div id="properties-panel" style="display: none;">
                    <div class="prop-section">
                        <h4>Layout</h4>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>X</label>
                                <input type="number" id="prop-x">
                            </div>
                            <div class="prop-group">
                                <label>Y</label>
                                <input type="number" id="prop-y">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>W</label>
                                <input type="number" id="prop-w">
                            </div>
                            <div class="prop-group">
                                <label>H</label>
                                <input type="number" id="prop-h">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Rotation</label>
                                <input type="number" id="prop-rotate">
                            </div>
                        </div>
                    </div>

                    <div class="prop-section" id="section-text" style="display: none;">
                        <h4>Text Settings</h4>
                        <div class="prop-row">
                            <textarea id="prop-inner-text" class="full-input" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="prop-section" id="section-input" style="display: none;">
                        <h4>Input Settings</h4>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Placeholder</label>
                                <input type="text" id="prop-placeholder" class="full-input">
                            </div>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Design & Style</h4>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Background Color</label>
                                <div class="color-picker-wrap">
                                    <input type="color" id="prop-bg-color">
                                    <input type="text" id="prop-bg-color-text" class="color-text">
                                </div>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Border Radius (px)</label>
                                <input type="number" id="prop-radius">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Opacity (%)</label>
                                <input type="number" id="prop-opacity" min="0" max="100">
                            </div>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Typography</h4>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Font Family</label>
                                <select class="full-input" id="prop-font-family">
                                    <option value="Inter">Inter</option>
                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                </select>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Text Color</label>
                                <div class="color-picker-wrap">
                                    <input type="color" id="prop-text-color">
                                    <input type="text" id="prop-text-color-text" class="color-text">
                                </div>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Size</label>
                                <input type="number" id="prop-font-size">
                            </div>
                            <div class="prop-group">
                                <label>Weight</label>
                                <select id="prop-font-weight">
                                    <option value="400">Regular</option>
                                    <option value="500">Medium</option>
                                    <option value="600">SemiBold</option>
                                    <option value="700">Bold</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Custom CSS</h4>
                        <div class="prop-row">
                            <textarea id="prop-custom-css" class="full-input" rows="4" placeholder="e.g. box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></textarea>
                        </div>
                    </div>
                    
                    <div class="prop-section actions-section">
                        <button id="btn-duplicate-el" class="action-btn secondary full-btn">Duplicate Element</button>
                        <button id="btn-delete-el" class="action-btn danger full-btn">Delete Element</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- App Logic -->
    <script src="js/app.js"></script>
</body>
</html>
