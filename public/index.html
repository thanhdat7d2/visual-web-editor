<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carostar Design</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Moveable.js for drag/resize/rotate -->
    <script src="https://unpkg.com/moveable@0.51.0/dist/moveable.min.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <div id="app">
        <!-- Top Navigation / Toolbar -->
        <header class="toolbar">
            <div class="logo">Carostar Design</div>
            <div class="tools">
                <button class="tool-btn active" id="btn-tool-select" data-tool="select"
                    title="Select (V)">Select</button>
                <div id="active-tool-pill" class="active-tool-pill" style="display: none;">
                    <span>Add <code id="active-tool-tag">&lt;div&gt;</code> — click canvas to place</span>
                    <button id="btn-cancel-tool" class="pill-close" title="Cancel (Esc)">&times;</button>
                </div>
            </div>
            <div class="actions">
                <button id="btn-save" class="action-btn primary">Export HTML</button>
            </div>
        </header>

        <div class="main-workspace">
            <!-- Left Sidebar: HTML Elements Palette & Layers -->
            <aside class="sidebar left-sidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="elements">Elements <span id="element-count-badge"
                            class="badge">116</span></button>
                    <button class="sidebar-tab" data-tab="layers">DOM Tree <span id="tree-count-badge"
                            class="badge">0</span></button>
                </div>

                <!-- Elements Palette Tab -->
                <div id="tab-elements" class="tab-content active">
                    <div class="palette-controls">
                        <input type="text" id="element-search" class="full-input" placeholder="Search HTML tags...">
                        <div id="category-filters" class="category-filters">
                            <button class="cat-pill active" data-category="All">All</button>
                            <button class="cat-pill" data-category="Root">Root</button>
                            <button class="cat-pill" data-category="Sectioning">Sectioning</button>
                            <button class="cat-pill" data-category="Elements">Elements</button>
                            <button class="cat-pill" data-category="Text">Text</button>
                        </div>
                        <div class="palette-hint">Click to place on canvas &bull; Double-click to quick-add</div>
                    </div>
                    <div id="elements-palette" class="elements-palette">
                        <!-- Categorized HTML element chips injected here -->
                    </div>
                </div>

                <!-- DOM / Element Tree Tab -->
                <div id="tab-layers" class="tab-content">
                    <div class="tree-toolbar">
                        <button id="btn-add-frame" class="tree-action-btn">+ New Frame</button>
                        <div class="tree-toolbar-right">
                            <button id="btn-expand-all" class="tree-icon-btn" title="Expand All">Expand</button>
                            <button id="btn-collapse-all" class="tree-icon-btn" title="Collapse All">Collapse</button>
                        </div>
                    </div>
                    <div id="dom-tree" class="dom-tree">
                        <!-- Recursive DOM/Element tree injected here -->
                    </div>
                </div>
            </aside>

            <!-- Center Canvas -->
            <main class="canvas-container" id="canvas-container">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <!-- The active frame sits here -->
                    <div id="active-frame" class="frame" data-id="frame-1" data-label="Frame 1">
                        <!-- Elements get appended here -->
                    </div>
                </div>
                <div class="canvas-hud">
                    <span class="hud-hint">Space + Drag to pan &bull; Scroll to zoom</span>
                    <button id="btn-zoom-out" class="hud-btn" title="Zoom Out">&minus;</button>
                    <button id="btn-zoom-reset" class="hud-btn hud-zoom-label" title="Reset View (100%)">100%</button>
                    <button id="btn-zoom-in" class="hud-btn" title="Zoom In">+</button>
                </div>
            </main>

            <!-- Right Sidebar: Properties -->
            <aside class="sidebar right-sidebar">
                <div id="properties-empty">Select an HTML element to edit its properties.</div>

                <div id="properties-panel" style="display: none;">
                    <div class="prop-section element-meta-header">
                        <div class="element-tag-row">
                            <code id="prop-el-tag" class="el-tag-badge">&lt;div&gt;</code>
                            <span id="prop-el-category" class="el-cat-badge">Sectioning</span>
                        </div>
                        <p id="prop-el-desc" class="el-desc-text"></p>
                    </div>

                    <div class="prop-section">
                        <h4>Layout</h4>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>X</label>
                                <input type="number" id="prop-x">
                            </div>
                            <div class="prop-group">
                                <label>Y</label>
                                <input type="number" id="prop-y">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>W</label>
                                <input type="number" id="prop-w">
                            </div>
                            <div class="prop-group">
                                <label>H</label>
                                <input type="number" id="prop-h">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Rotation</label>
                                <input type="number" id="prop-rotate">
                            </div>
                        </div>
                    </div>

                    <div class="prop-section" id="section-text" style="display: none;">
                        <h4>Content</h4>
                        <div class="prop-row">
                            <textarea id="prop-inner-text" class="full-input" rows="3"
                                placeholder="Element text or inner content..."></textarea>
                        </div>
                    </div>

                    <div class="prop-section" id="section-attrs">
                        <h4>HTML Attributes</h4>
                        <div id="attrs-list" class="attrs-list"></div>
                        <div class="attr-add-row">
                            <input type="text" id="attr-new-name" class="full-input" placeholder="attr (e.g. href)">
                            <input type="text" id="attr-new-value" class="full-input" placeholder="value">
                            <button id="btn-add-attr" class="action-btn secondary" type="button">+</button>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Design &amp; Style</h4>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Background Color</label>
                                <div class="color-picker-wrap">
                                    <input type="color" id="prop-bg-color">
                                    <input type="text" id="prop-bg-color-text" class="color-text">
                                </div>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Border Radius (px)</label>
                                <input type="number" id="prop-radius">
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Opacity (%)</label>
                                <input type="number" id="prop-opacity" min="0" max="100">
                            </div>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Typography</h4>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Font Family</label>
                                <select class="full-input" id="prop-font-family">
                                    <option value="Inter">Inter</option>
                                    <option value="Arial">Arial</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                    <option value="Courier New">Courier New</option>
                                </select>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group full">
                                <label>Text Color</label>
                                <div class="color-picker-wrap">
                                    <input type="color" id="prop-text-color">
                                    <input type="text" id="prop-text-color-text" class="color-text">
                                </div>
                            </div>
                        </div>
                        <div class="prop-row">
                            <div class="prop-group">
                                <label>Size</label>
                                <input type="number" id="prop-font-size">
                            </div>
                            <div class="prop-group">
                                <label>Weight</label>
                                <select id="prop-font-weight">
                                    <option value="400">Regular</option>
                                    <option value="500">Medium</option>
                                    <option value="600">SemiBold</option>
                                    <option value="700">Bold</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="prop-section">
                        <h4>Custom CSS</h4>
                        <div class="prop-row">
                            <textarea id="prop-custom-css" class="full-input" rows="4"
                                placeholder="e.g. box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></textarea>
                        </div>
                    </div>

                    <div class="prop-section actions-section">
                        <button id="btn-duplicate-el" class="action-btn secondary full-btn">Duplicate Element</button>
                        <button id="btn-delete-el" class="action-btn danger full-btn">Delete Element</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modular ES App Entry -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
